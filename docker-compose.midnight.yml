# Midnight Network Infrastructure for Local Development
#
# Mirrors midnight-local-dev/standalone.yml versions:
#   - midnightntwrk/midnight-node:0.22.3
#   - midnightntwrk/indexer-standalone:4.0.1
#   - midnightntwrk/proof-server:8.0.3
#
# Usage:
#   docker compose -f docker-compose.midnight.yml up -d
#   docker compose -f docker-compose.midnight.yml down
#
# Endpoints:
#   - Node (consensus + RPC):   ws://localhost:9944
#   - Indexer GraphQL (HTTP):   http://localhost:8088/api/v3/graphql
#   - Indexer GraphQL (WS sub): ws://localhost:8088/api/v3/graphql/ws
#   - Proof Server:             http://localhost:6300

services:
  midnight-node:
    image: midnightntwrk/midnight-node:0.22.3
    container_name: owlid-midnight-node
    ports:
      - '9944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - midnight-network

  midnight-indexer:
    image: midnightntwrk/indexer-standalone:4.0.1
    container_name: owlid-midnight-indexer
    env_file: midnight.env.example
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      midnight-node:
        condition: service_healthy
    networks:
      - midnight-network

  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    container_name: owlid-proof-server
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_LOG: 'info'
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - midnight-network

networks:
  midnight-network:
