# Midnight Network Infrastructure for Local Development
#
# Mirrors midnight-local-dev/standalone.yml versions:
#   - midnightntwrk/midnight-node:0.22.3
#   - midnightntwrk/indexer-standalone:4.0.1
#   - midnightntwrk/proof-server:8.0.3
#
# Usage:
#   docker compose -f docker-compose.midnight.yml up -d
#   docker compose -f docker-compose.midnight.yml down
#
# Endpoints:
#   - Node (consensus + RPC):   ws://localhost:9944
#   - Indexer GraphQL (HTTP):   http://localhost:8088/api/v3/graphql
#   - Indexer GraphQL (WS sub): ws://localhost:8088/api/v3/graphql/ws
#   - Proof Server:             http://localhost:6300

services:
  midnight-node:
    image: midnightntwrk/midnight-node:0.22.3
    container_name: owlid-midnight-node
    ports:
      - '9944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - midnight-network

  midnight-indexer:
    image: midnightntwrk/indexer-standalone:4.0.1
    container_name: owlid-midnight-indexer
    env_file: midnight.env.example
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      midnight-node:
        condition: service_healthy
    networks:
      - midnight-network

  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    container_name: owlid-proof-server
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_LOG: 'info'
      RUST_BACKTRACE: 'full'
    # Upstream image is a Nix scratch layer with neither curl nor a
    # shell on PATH, so docker compose has no portable way to probe it.
    # Liveness is verified externally via `curl localhost:6300/version`
    # from the host (or via the proxy/sidecar that forwards there).
    networks:
      - midnight-network

  # CORS-injecting reverse proxy that the browser-based holder app calls
  # when it's configured for the "proof server" provider. Opt-in via the
  # `proof-proxy` profile: `docker compose --profile proof-proxy up`. The
  # production Cloud Run service uses the same Dockerfile + Caddyfile.
  proof-server-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proof-server
    container_name: owlid-proof-server-proxy
    profiles: ['proof-proxy']
    depends_on:
      proof-server:
        condition: service_started
    ports:
      - '6301:8080'
    environment:
      PORT: '8080'
      UPSTREAM_HOST: 'proof-server'
      UPSTREAM_PORT: '6300'
      # Override per .env to add origins. Default allows localhost + the
      # two prod hostnames so dev mirrors prod CORS behavior.
      CORS_ALLOWED_ORIGIN_REGEX: '${CORS_ALLOWED_ORIGIN_REGEX:-^https?://(localhost(:[0-9]+)?|.*\.sashoush\.dev|.*\.owlid\.app)$$}'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/version']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - midnight-network

networks:
  midnight-network:
