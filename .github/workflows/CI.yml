name: CI

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Install dependencies
        run: bun install

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Oxlint
        run: bun run lint

      - name: Prettier check
        run: bun run format:check

      - name: TOML format check
        run: bun run format:toml:check

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    # The Midnight-heavy crates (proof-system, issuer/verification-service)
    # link very large test binaries; debug info made the linker OOM
    # (SIGBUS) on the runner. Drop debug info + incremental for the test
    # build to keep the link step within the runner's memory.
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --workspace

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build workspace libraries
        run: bun run ci:build-libs

      # midnight-sidecar is excluded: it imports compactc-generated contract
      # artifacts (packages/midnight-sidecar/managed/, built by `just compact`)
      # that aren't checked in and need the Compact toolchain to produce.
      - name: Typecheck packages
        run: bun run ci:typecheck

  docs:
    name: Docs ↔ code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Type-checks every ```ts fence against packages/sdk/src and asserts the
      # docs' links, predicate claim paths, HTTP routes, and SDK reference
      # pages still match the code. No build or running service needed.
      - name: Check docs against code
        run: bun run check:docs

  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build workspace libraries
        run: bun run ci:build-libs

      - name: Unit tests (sdk, app, verifier-app, sidecar)
        run: |
          bun run --filter @owlid/sdk test
          bun run --filter @owlid/app test
          bun run --filter @owlid/verifier-app test
          bun run --filter @owlid/midnight-sidecar test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build workspace libraries
        run: bun run ci:build-libs

      - name: Install ffmpeg (verifier fake-camera QR video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Verifier-app e2e
        run: bun run --filter @owlid/verifier-app test:e2e

      - name: Holder-app e2e
        run: bun run --filter @owlid/app test:e2e
