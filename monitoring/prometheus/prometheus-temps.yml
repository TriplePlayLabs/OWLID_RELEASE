global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Temps deployment: prometheus is in owlid-infra project,
# backend services are in owlid project — use custom domain URLs
scrape_configs:
  - job_name: verification-service
    metrics_path: /prometheus
    scheme: https
    static_configs:
      - targets: ['owlid-api.sashoush.dev']
        labels:
          service: verification

  - job_name: issuer-service
    metrics_path: /prometheus
    scheme: https
    static_configs:
      - targets: ['owlid-issuer.sashoush.dev']
        labels:
          service: issuer
