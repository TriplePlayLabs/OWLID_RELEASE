<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14.5" fill="#0B0D12" stroke="#EAB308" stroke-width="2.5"/>
  <!-- Wings -->
  <ellipse cx="8.5" cy="22" rx="4.5" ry="3.5" fill="#C29407" transform="rotate(-20 8.5 22)"/>
  <ellipse cx="23.5" cy="22" rx="4.5" ry="3.5" fill="#C29407" transform="rotate(20 23.5 22)"/>
  <!-- Body -->
  <ellipse cx="16" cy="21" rx="7" ry="6" fill="#EAB308"/>
  <!-- Abdomen -->
  <ellipse cx="16" cy="23" rx="5" ry="3.5" fill="#92700A"/>
  <!-- Head -->
  <circle cx="16" cy="13" r="7.5" fill="#EAB308"/>
  <!-- Eye sockets -->
  <circle cx="12.5" cy="12.5" r="3.8" fill="#6B4E0A"/>
  <circle cx="19.5" cy="12.5" r="3.8" fill="#6B4E0A"/>
  <!-- Eyes -->
  <circle cx="12.5" cy="12.5" r="2.8" fill="white"/>
  <circle cx="19.5" cy="12.5" r="2.8" fill="white"/>
  <!-- Pupils -->
  <circle cx="12.5" cy="12.5" r="1.3" fill="#1A1402"/>
  <circle cx="19.5" cy="12.5" r="1.3" fill="#1A1402"/>
  <!-- Eye highlights -->
  <circle cx="11.8" cy="11.7" r="0.55" fill="white"/>
  <circle cx="18.8" cy="11.7" r="0.55" fill="white"/>
  <!-- Beak -->
  <ellipse cx="16" cy="16" rx="1.4" ry="1.7" fill="#F5C72B"/>
</svg>
