[package]
authors     = ["OwlID Team"]
description = "OwlID SDK - Cryptographic identity primitives"
edition     = "2021"
license     = "MIT"
name        = "owl_id"
repository  = "https://github.com/owlid/owlid"
version     = "1.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", default-features = false, features = ["napi3"] }
napi-derive = { version = "3.0.0", default-features = false, features = [
  "type-def",
] }

# Use existing OwlID crates
owl-crypto       = { path = "../../crates/crypto" }
owl-proof-system = { path = "../../crates/proof-system" }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hash functions for convenience exports
blake3 = "1.5"
hex    = "0.4"
sha2   = "0.10"

# Native targets (Linux/macOS/Windows .node addons): bake the proving
# keys into the binary. There's no network or filesystem fetch story on
# the native side — host processes expect to start and prove immediately.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
owl-zk-circuits = { path = "../../crates/zk-circuits", default-features = false, features = [
  "verifier",
  "prover-keys-embedded",
] }

# WASM target (browser PWA wallet): leave the multi-MB proving keys out
# of the WASM blob. The TS SDK fetches them lazily from the app's origin
# (cached in IndexedDB after first download) and hands them in via
# `set_proving_key_bytes` before the first proof. Verifying keys are
# small enough to embed everywhere.
[target.'cfg(target_arch = "wasm32")'.dependencies]
owl-zk-circuits = { path = "../../crates/zk-circuits", default-features = false, features = [
  "verifier",
  "prover-keys-external",
] }

[build-dependencies]
napi-build = "2"
