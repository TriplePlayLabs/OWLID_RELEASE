[package]
authors     = ["OwlID Team"]
description = "OwlID SDK - Cryptographic identity primitives"
edition     = "2021"
license     = "MIT"
name        = "owl_id"
repository  = "https://github.com/owlid/owlid"
version     = "1.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", default-features = false, features = ["napi3"] }
napi-derive = { version = "3.0.0", default-features = false, features = [
  "type-def",
] }

# Use existing OwlID crates
owl-crypto       = { path = "../../crates/crypto" }
owl-proof-system = { path = "../../crates/proof-system" }
owl-zk-circuits  = { path = "../../crates/zk-circuits" }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hash functions for convenience exports
blake3 = "1.5"
hex    = "0.4"
sha2   = "0.10"

[build-dependencies]
napi-build = "2"
