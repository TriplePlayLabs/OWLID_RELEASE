<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>owl-id WASM Test</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 1200px;
        margin: 40px auto;
        padding: 20px;
        background: #1a1b26;
        color: #a9b1d6;
      }
      h1 {
        color: #7aa2f7;
      }
      .test {
        background: #24283b;
        padding: 15px;
        margin: 10px 0;
        border-radius: 5px;
        border-left: 3px solid #565f89;
      }
      .test.pass {
        border-left-color: #9ece6a;
      }
      .test.fail {
        border-left-color: #f7768e;
      }
      .status {
        font-weight: bold;
        margin-right: 10px;
      }
      .pass .status {
        color: #9ece6a;
      }
      .fail .status {
        color: #f7768e;
      }
      pre {
        background: #1a1b26;
        padding: 10px;
        border-radius: 3px;
        overflow-x: auto;
      }
      #results {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>owl-id WASM Browser Test</h1>
    <div id="results">
      <p>Loading WASM module...</p>
    </div>

    <script type="module">
      const results = document.getElementById('results')

      function addTest(name, passed, details) {
        const div = document.createElement('div')
        div.className = `test ${passed ? 'pass' : 'fail'}`
        div.innerHTML = `
                <span class="status">${passed ? '✓' : '✗'}</span>
                <strong>${name}</strong>
                ${details ? `<pre>${details}</pre>` : ''}
            `
        results.appendChild(div)
      }

      async function runTests() {
        results.innerHTML = '<h2>Running Tests...</h2>'

        try {
          // Import the WASM module
          const module = await import('../owl-id.wasi-browser.js')
          addTest('WASM Module Load', true, 'Successfully loaded owl-id WASM module')

          // Test 1: Generate KeyPair
          try {
            const keypair = module.KeyPair.generate()
            const pubKeyHex = keypair.publicKey().toHex()
            addTest('KeyPair Generation', true, `Public key: ${pubKeyHex.substring(0, 32)}...`)
          } catch (e) {
            addTest('KeyPair Generation', false, e.message)
          }

          // Test 2: Sign and Verify
          try {
            const keypair = module.KeyPair.generate()
            const message = new TextEncoder().encode('Hello, WASM!')
            const signature = keypair.sign(Buffer.from(message))
            const publicKey = keypair.publicKey()
            const valid = publicKey.verify(Buffer.from(message), signature)
            addTest(
              'Sign and Verify',
              valid,
              `Message: "Hello, WASM!"\nSignature verified: ${valid}`,
            )
          } catch (e) {
            addTest('Sign and Verify', false, e.message)
          }

          // Test 3: Hash Functions
          try {
            const data = new TextEncoder().encode('Test data')
            const sha256Hash = module.sha256(Buffer.from(data))
            const blake3Hash = module.blake3(Buffer.from(data))
            addTest('Hash Functions', true, `SHA-256: ${sha256Hash}\nBLAKE3: ${blake3Hash}`)
          } catch (e) {
            addTest('Hash Functions', false, e.message)
          }

          // Test 4: Document Creation and Issuance
          try {
            const issuerKey = module.KeyPair.generate()
            const ownerKey = module.KeyPair.generate()

            const attributes = {
              issuerKey: issuerKey.publicKey().toHex(),
              ownerKey: ownerKey.publicKey().toHex(),
              name: 'Alice',
              age: 25,
              email: 'alice@example.com',
            }

            const doc = module.Document.fromJson(JSON.stringify(attributes))
            const proofDoc = doc.issue(issuerKey)
            const rootHash = proofDoc.rootHash()

            addTest('Document Creation and Issuance', true, `Root hash: ${rootHash}`)
          } catch (e) {
            addTest('Document Creation and Issuance', false, e.message)
          }

          // Test 5: Token Creation and Verification (Selective Disclosure)
          try {
            const issuerKey = module.KeyPair.generate()
            const ownerKey = module.KeyPair.generate()

            const attributes = {
              issuerKey: issuerKey.publicKey().toHex(),
              ownerKey: ownerKey.publicKey().toHex(),
              name: 'Bob',
              age: 30,
              ssn: '123-45-6789',
            }

            const doc = module.Document.fromJson(JSON.stringify(attributes))
            const proofDoc = doc.issue(issuerKey)

            const infoRequest = {
              mandatory: ['age'], // Only disclose age, not name or SSN
              optional: [],
              trustedIssuers: [issuerKey.publicKey().toHex()],
              challenge: 'browser-challenge-123',
            }

            const token = proofDoc.createToken(ownerKey, infoRequest, 3600)
            const tokenJson = token.toJson()

            // Verify selective disclosure - SSN should NOT be in token
            const ssnLeaked = tokenJson.includes('123-45-6789')
            const nameLeaked = tokenJson.includes('Bob')

            const result = token.verify([issuerKey.publicKey()], 'browser-challenge-123')

            const passed = !ssnLeaked && !nameLeaked
            addTest(
              'Selective Disclosure',
              passed,
              `SSN leaked: ${ssnLeaked} (should be false)\n` +
                `Name leaked: ${nameLeaked} (should be false)\n` +
                `Verification result: ${result}`,
            )
          } catch (e) {
            addTest('Selective Disclosure', false, e.message)
          }

          // Test 6: Serialization
          try {
            const issuerKey = module.KeyPair.generate()
            const ownerKey = module.KeyPair.generate()

            const attributes = {
              issuerKey: issuerKey.publicKey().toHex(),
              ownerKey: ownerKey.publicKey().toHex(),
              data: 'test',
            }

            const doc = module.Document.fromJson(JSON.stringify(attributes))
            const proofDoc = doc.issue(issuerKey)

            // Serialize ProofDocument
            const json = proofDoc.toJson()
            const restored = module.ProofDocument.fromJson(json)

            const hashMatch = restored.rootHash() === proofDoc.rootHash()
            addTest(
              'Serialization',
              hashMatch,
              `Original hash: ${proofDoc.rootHash()}\n` +
                `Restored hash: ${restored.rootHash()}\n` +
                `Match: ${hashMatch}`,
            )
          } catch (e) {
            addTest('Serialization', false, e.message)
          }
        } catch (e) {
          addTest('WASM Module Load', false, e.message)
        }
      }

      runTests()
    </script>
  </body>
</html>
