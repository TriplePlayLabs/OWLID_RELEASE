server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    # COOP/COEP for SharedArrayBuffer / WASM threads.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    # CSP — `wasm-unsafe-eval` needed for WebAssembly; `unsafe-inline` styles
    # are needed for Vite-emitted runtime CSS until we move to nonce-based
    # CSP. Connect-src is intentionally `*` here: each deployment terminates
    # at a Cloudflare Tunnel hostname and the SDK is configured at runtime,
    # so we can't pin the exact backend URL in the shared SPA image. Tighten
    # at the Cloudflare layer with rate-limit + WAF rules instead.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self), camera=(self), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Strict-Transport-Security is intentionally NOT set here — the upstream
    # Cloudflare edge owns HSTS so HSTS state survives nginx restarts and
    # subdomain-wide preload toggling lives in one place.

    # Cache static assets — keep COOP/COEP and CSP on every response.
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self), camera=(self), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # /config.js is generated per container start by runtime-config.sh and
    # MUST NOT be cached or its values will leak across deployments.
    location = /config.js {
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 256;
}
