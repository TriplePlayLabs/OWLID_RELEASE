[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name              = "owl-zk-circuits"
version.workspace = true

[dependencies]
# ZK proving system
ark-bls12-381         = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["r1cs"] }
ark-ff                = "0.5"
ark-groth16           = "0.5"
ark-r1cs-std          = "0.5"
ark-relations         = "0.5"
ark-serialize         = "0.5"
ark-snark             = "0.5"
ark-std               = "0.5"

# Serialization
hex.workspace        = true
serde.workspace      = true
serde_json.workspace = true

# Crypto
rand.workspace = true
sha2.workspace = true

# Error handling
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
harness = false
name    = "zk_circuits"
